[package]
name = "cordis-direct-call-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
cordis = { path = "../../../crates/cordis" }
cordis-up = { path = "../../../crates/cordis-up" }
cordis-supervisor = { path = "../../../crates/cordis-supervisor" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
