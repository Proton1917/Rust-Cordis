[package]
name = "cordis-http"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
publish.workspace = true
license.workspace = true
description = "HTTP static pages and entry addresses for Cordis applications."

[lib]
crate-type = ["cdylib"]

[dependencies]
cordis-sdk.workspace = true
web-api.workspace = true
forward-api.workspace = true
http-api.workspace = true
stream-api.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
serde_json = "=1.0.154"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tokio = { workspace = true, features = ["net"] }
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
cordis-testkit.workspace = true
