[package]
name = "cordis-secrets"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
publish.workspace = true
license.workspace = true
description = "Scoped file-backed secret provider for Cordis."

[lib]
crate-type = ["cdylib"]

[dependencies]
cordis-sdk.workspace = true
secrets-api.workspace = true
serde.workspace = true
dotenv-parser = "=0.1.3"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }
