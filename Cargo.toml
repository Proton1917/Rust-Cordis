[workspace]
members = [
    "crates/cordis",
    "crates/cordis-testkit",
    "crates/cordis-abi",
    "crates/cordis-sdk",
    "crates/cordis-sdk-macros",
    "crates/cordis-up",
    "crates/cordis-supervisor",
    "crates/cordis-routing",
    "crates/cordis-channels",
    "crates/cordis-web-deployment",
    "crates/cordis-types",
    "crates/cordis-process",
    "crates/cordis-host",
    "crates/cordis-dev",
    "crates/cordis-idl",
    "crates/cordis-runtime",
    "crates/cordis-contract",
    "plugins/kv-api",
    "plugins/kv-mem",
    "plugins/kv-mem-component",
    "plugins/counter",
    "plugins/counter-component",
    "plugins/watch",
    "plugins/console-log",
    "plugins/kv-file",
    "plugins/kv-contract",
    "plugins/web-api",
    "plugins/forward-api",
    "plugins/http",
    "plugins/http-api",
    "plugins/stream-api",
    "plugins/http-echo",
    "plugins/secrets-api",
    "plugins/secrets",
    "plugins/window-api",
    "plugins/window",
]
exclude = ["target/tmp", "crates/cordis-up/fuzz", "crates/cordis-supervisor/fixtures/process-plugin", "crates/cordis-supervisor/fixtures/manager-plugin", "crates/cordis-host/tests/fixtures", "crates/cordis-host/tests/driver", "crates/cordis-runtime/fuzz", "crates/cordis-runtime/fixtures/plugin", "crates/cordis-runtime/fixtures/watch-fails", "crates/cordis-runtime/fixtures/console-emitter"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[workspace.dependencies]
slotmap = "=1.1.1"
parking_lot = "=0.13.0"
futures-util = "=0.3.34"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
ciborium = "=0.2.2"
syn = { version = "=2.0.119", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
nix = { version = "=0.31.3", features = ["signal", "process"] }
rustix = { version = "=1.1.5", features = ["process"] }
semver = "=1.0.28"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
cordis = { path = "crates/cordis" }
cordis-testkit = { path = "crates/cordis-testkit" }
cordis-abi = { path = "crates/cordis-abi" }
cordis-sdk = { path = "crates/cordis-sdk" }
cordis-sdk-macros = { path = "crates/cordis-sdk-macros" }
cordis-up = { path = "crates/cordis-up" }
cordis-types = { path = "crates/cordis-types" }
cordis-process = { path = "crates/cordis-process" }
cordis-supervisor = { path = "crates/cordis-supervisor" }
cordis-routing = { path = "crates/cordis-routing" }
cordis-channels = { path = "crates/cordis-channels" }
cordis-web-deployment = { path = "crates/cordis-web-deployment" }
cordis-contract = { path = "crates/cordis-contract" }
cordis-idl = { path = "crates/cordis-idl" }
kv-api = { path = "plugins/kv-api" }
kv-mem-component = { path = "plugins/kv-mem-component" }
counter-component = { path = "plugins/counter-component" }
web-api = { path = "plugins/web-api" }
forward-api = { path = "plugins/forward-api" }
http-api = { path = "plugins/http-api" }
stream-api = { path = "plugins/stream-api" }
secrets-api = { path = "plugins/secrets-api" }
window-api = { path = "plugins/window-api" }
