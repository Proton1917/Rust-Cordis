[workspace]
members = ["crates/cordis", "crates/cordis-testkit", "crates/cordis-abi"]
exclude = ["target/tmp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[workspace.dependencies]
slotmap = "=1.1.1"
parking_lot = "=0.13.0"
futures-util = "=0.3.34"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
ciborium = "=0.2.2"
syn = { version = "=2.0.119", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
cordis = { path = "crates/cordis" }
cordis-testkit = { path = "crates/cordis-testkit" }
