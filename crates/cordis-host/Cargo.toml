[package]
name = "cordis-host"
description = "Native plugin process host for Cordis ABI and UP/1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cordis-abi.workspace = true
cordis-up.workspace = true
cordis-types.workspace = true
libloading = "=0.9.0"
semver.workspace = true
serde.workspace = true
serde_json = "=1.0.154"
parking_lot.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std"] }
clap = { version = "=4.6.7", features = ["derive"] }

[lib]
path = "src/lib.rs"

[dev-dependencies]
cordis-testkit.workspace = true
