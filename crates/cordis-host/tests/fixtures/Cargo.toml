[workspace]
members = ["api", "provider", "consumer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cordis-sdk = { path = "../../../cordis-sdk" }
loader-fixture-api = { path = "api" }
serde = { version = "=1.0.229", features = ["derive"] }
