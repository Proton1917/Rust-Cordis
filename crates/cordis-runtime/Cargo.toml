[package]
name = "cordis-runtime"
version = "0.1.11"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "cordis"
path = "src/main.rs"

[dependencies]
cordis.workspace = true
cordis-supervisor.workspace = true
cordis-web-deployment.workspace = true
cordis-up.workspace = true
cordis-artifact.workspace = true
cordis-types.workspace = true
futures-util.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
tokio = { workspace = true, features = ["signal", "process", "io-util"] }
parking_lot.workspace = true
serde.workspace = true
serde_json = "=1.0.154"
sha2 = "=0.10.9"
toml = "=1.2.1"
semver = { workspace = true, features = ["serde"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
cordis-testkit.workspace = true
