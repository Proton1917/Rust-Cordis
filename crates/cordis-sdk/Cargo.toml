[package]
name = "cordis-sdk"
version = "0.2.3"
edition.workspace = true
rust-version = "1.85"
publish.workspace = true
license.workspace = true

[dependencies]
cordis-abi.workspace = true
cordis-sdk-macros.workspace = true
cordis-types.workspace = true
serde.workspace = true
futures-lite = { version = "=2.6.1", default-features = false, features = ["std"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread"], optional = true }

[features]
default = ["tokio"]
# ADR-0055：为插件代码提供库级 tokio 执行上下文。
tokio = ["dep:tokio"]

[dev-dependencies]
cordis-abi = { workspace = true, features = ["test-support"] }
kv-api.workspace = true
kv-mem-component.workspace = true
counter-component.workspace = true
tokio.workspace = true
futures-util.workspace = true
