[package]
name = "cordis-process"
description = "Bounded subprocess execution and process-group ownership for Cordis."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cordis-up.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "signal"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
